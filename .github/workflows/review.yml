name: Weekly rules review (judgement)

# Saturday 04:00 Phoenix, one hour after the gather. The gap is load-bearing: the evidence
# must be committed before this reads it, and if this half breaks or is switched off the
# record still exists and this can be re-run alone without re-gathering.
#
# Ships INERT. Without ANTHROPIC_API_KEY it logs why and passes, because a red cross every
# Saturday teaches everyone to ignore red crosses.

on:
  schedule:
    - cron: '0 11 * * 6'
  workflow_dispatch:
    inputs:
      review_dir:
        description: 'reviews/<date> to analyse. Defaults to the newest.'
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick the review directory
        id: pick
        run: |
          set -euo pipefail
          dir="${{ inputs.review_dir }}"
          [ -n "${dir}" ] || dir=$(ls -d reviews/*/ 2>/dev/null | sort | tail -1 | sed 's:/$::')
          if [ -z "${dir}" ] || [ ! -f "${dir}/evidence.json" ]; then
            echo "No evidence to analyse. The gather has not run yet."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Analyse
        if: steps.pick.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTHSKY_FEDERATION_KEY: ${{ secrets.NTHSKY_FEDERATION_KEY }}
          NTHSKY_BUILDER_TOKEN: ${{ secrets.NTHSKY_BUILDER_TOKEN }}
        run: python3 review/analyze.py "${{ steps.pick.outputs.dir }}"

      - name: Open the proposal as a PR
        if: steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${{ steps.pick.outputs.dir }}"
          [ -f "${dir}/proposal.md" ] || { echo "inert or no proposal; nothing to open"; exit 0; }
          branch="review/$(basename "${dir}")"
          git config user.name  "airules-review"
          git config user.email "noreply@anthropic.com"
          git checkout -B "${branch}"
          git add "${dir}"
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "Weekly rules review: $(basename "${dir}")"
          git push -f -u origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "Weekly rules review: $(basename "${dir}")" \
            --body "$(printf '%s\n' \
              "Proposed changes to \`RULES.md\` and \`LESSONS.md\`, read off this week's" \
              "evidence. Nothing here has been applied and no site was edited." \
              "" \
              "Read \`${dir}/proposal.md\`. Merge what is right, delete what is not." \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")" \
            || echo "PR already open for ${branch}"
