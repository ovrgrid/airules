name: Sync AIRULES to every site

# Pushes the canonical rules block from RULES.md into every consumer repo's CLAUDE.md.
# Push-based on purpose: one token lives in one repo, instead of five repos each holding
# a read token for this one. Docs-only, opened as a PR so nothing lands unreviewed.
#
# Requires the secret AIRULES_SYNC_TOKEN: a fine-grained PAT scoped to the ovrgrid repos
# listed in sync/consumers.json, with Contents read+write and Pull requests read+write.
# It is a GitHub secret and never appears in this repo (RULES.md R1).

on:
  push:
    branches: [main]
    paths: ['RULES.md', 'sync/**', '.github/workflows/sync-rules.yml']
  schedule:
    - cron: '17 13 * * 1'   # Mondays 13:17 UTC, catches hand-edited drift
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AIRULES
        uses: actions/checkout@v4
        with:
          path: airules

      - name: Fan out to every consumer
        env:
          GH_TOKEN: ${{ secrets.AIRULES_SYNC_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "AIRULES_SYNC_TOKEN is not set. Nothing can be synced."
            exit 1
          fi
          version=$(grep -o 'AIRULES:START [^ ]*' airules/RULES.md | head -1 | awk '{print $2}')
          branch="airules/sync-${version}"
          failed=0

          python3 - <<'PY' > consumers.txt
          import json
          with open('airules/sync/consumers.json') as fh:
              for c in json.load(fh)['consumers']:
                  print(c['repo'], c['file'], c['branch'])
          PY

          while read -r repo file base; do
            echo "::group::${repo}"
            rm -rf work
            if ! git clone --depth 1 --branch "${base}" \
                 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" work; then
              echo "cannot clone ${repo}; is the token scoped to it?"
              failed=1; echo "::endgroup::"; continue
            fi

            set +e
            python3 airules/sync/apply_block.py airules/RULES.md "work/${file}"
            rc=$?
            set -e
            if [ "${rc}" = "1" ]; then
              echo "${repo} already carries ${version}"
              echo "::endgroup::"; continue
            fi
            if [ "${rc}" = "2" ]; then
              echo "${repo}/${file} has no AIRULES markers. A human adds them once."
              failed=1; echo "::endgroup::"; continue
            fi

            cd work
            git config user.name  "airules-sync"
            git config user.email "noreply@anthropic.com"
            git checkout -B "${branch}"
            git add "${file}"
            git commit -q -m "Sync network rules block to ${version}

Automated from ovrgrid/airules RULES.md. Do not edit the block in this repo:
the next sync overwrites it. Change the rules in airules instead."
            git push -f -u origin "${branch}"
            gh pr create --repo "${repo}" --base "${base}" --head "${branch}" \
              --title "Sync network rules block to ${version}" \
              --body "$(printf '%s\n' \
                "The shared rules block in \`${file}\` drifted from \`ovrgrid/airules\`." \
                "" \
                "This PR replaces everything between the AIRULES markers with the canonical" \
                "text at ${version}. Nothing outside the markers is touched, so this repo's" \
                "own architecture, deploy notes and layout are untouched." \
                "" \
                "Docs only. No code, no schema, no deploy behaviour changes." \
                "" \
                "---" \
                "_Generated by [Claude Code](https://claude.ai/code)_")" \
              || echo "PR already open for ${branch} on ${repo}"
            cd ..
            echo "::endgroup::"
          done < consumers.txt

          exit "${failed}"
